# .github/workflows/python-app.yml
name: Pipeline CI/CD - FastAPI

on:
  push:
    branches: [ "develop", "main" ]

# Variáveis globais (a "Dica" do lab): mudou o nome da imagem, muda só aqui
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  # 1) BUILD: instala dependências, roda lint e testes
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Testes (pytest)
        run: pytest || [ $? -eq 5 ]   # código 5 = nenhum teste encontrado (não quebra)

  # 2) IMAGEM: gera a imagem Docker e envia para o Docker Hub
  imagem:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

  # 3) HOMOLOGAÇÃO: automático quando o push é na develop
  deploy_homologacao:
    needs: imagem
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: homologacao        # usa os secrets do Environment "homologacao"
    steps:
      - name: Deploy na EC2 de homologação (porta 8080)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker stop api-homol || true
            docker rm api-homol || true
            docker run -d --name api-homol --restart always \
              -p 8080:8000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # 4) PRODUÇÃO: só na main + aprovação manual (configurada no Environment "producao")
  deploy_producao:
    needs: imagem
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao           # aqui o GitHub PAUSA e espera a aprovação
    steps:
      - name: Deploy na EC2 de produção (porta 80)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker stop api-prd || true
            docker rm api-prd || true
            docker run -d --name api-prd --restart always \
              -p 80:8000 ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
